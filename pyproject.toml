[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eth-price-poc-sdk"
version = "0.3.0"
description = "DEPRECATED — retired in favour of price-of-ethereum (https://github.com/propeller-heads/price-of-ethereum)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PropellerHeads" }]
keywords = ["defi", "fynd", "tycho", "depth", "ethereum", "trader-data"]
classifiers = ["Development Status :: 7 - Inactive"]
dependencies = [
    "requests>=2.34.2",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]

[project.urls]
Repository = "https://github.com/propeller-heads/eth-price-poc-sdk"
Issues     = "https://github.com/propeller-heads/eth-price-poc-sdk/issues"
LiveSite   = "https://marketprice.xyz/"

[tool.setuptools.packages.find]
where = ["."]
include = ["eth_price_poc*"]

[tool.setuptools.package-data]
eth_price_poc = ["py.typed"]
