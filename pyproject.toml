[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eth-price-poc-sdk"
version = "0.3.0"
description = "Generate block-by-block on-chain depth data locally with your own Fynd + Tycho instance."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PropellerHeads" }]
keywords = ["defi", "fynd", "tycho", "depth", "ethereum", "trader-data"]
dependencies = [
    "requests>=2.34.2",
]

[project.optional-dependencies]
pandas = ["pandas>=1.5"]

[project.urls]
Repository = "https://github.com/propeller-heads/eth-price-poc-sdk"
Issues     = "https://github.com/propeller-heads/eth-price-poc-sdk/issues"
LiveSite   = "https://marketprice.xyz/"

[tool.setuptools.packages.find]
where = ["."]
include = ["eth_price_poc*"]

[tool.setuptools.package-data]
eth_price_poc = ["py.typed"]
